<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>

<script>
(function(){
  const db = ERP.db;
  const page = ERP.shell({ title:"Purchase & GRN", crumb:"Stock", page:"purchase.html", module:"purchase" });
  if(!page) return;
  let tab = "orders";

  const poFields = [
    { name:"supplier", label:"Supplier", type:"select", required:true,
      options: db.suppliers.map(s => ({ value:s.id, label:s.name + " — " + s.supplies })) },
    { name:"item", label:"Item", type:"text", required:true, hint:"e.g. 40s combed cotton" },
    { name:"qty", label:"Quantity", type:"number", required:true, min:1 },
    { name:"unit", label:"Unit", type:"select", options:["kg","nos","m","litre"] },
    { name:"rate", label:"Rate", type:"number", required:true, step:"0.01" },
    { name:"due", label:"Wanted by", type:"date", required:true }
  ];

  function newPO(){
    ERP.modal({
      title:"New purchase order", wide:true, okText:"Raise order", body: ERP.form(poFields),
      onOk(scope){
        const v = ERP.readForm(scope, poFields); if(!v) return false;
        const id = ERP.nextId(db.purchaseOrders, "PU-", 4);
        db.purchaseOrders.unshift({ id, date: ERP.today(), supplier:v.supplier, item:v.item,
          qty:Number(v.qty), unit:v.unit, rate:Number(v.rate), due:v.due, status:"Ordered", grn:"" });
        ERP.save(); ERP.toast("Raised " + id + " on " + ERP.nameOf(db.suppliers, v.supplier) + "."); render();
      }
    });
  }

  function receive(po){
    const fields = [
      { name:"qty", label:"Quantity received", type:"number", value: po.qty, required:true },
      { name:"lot", label:"Supplier lot number", type:"text", value:"", hint:"Printed on the bags or cones" },
      { name:"rack", label:"Put away at", type:"text", value:"A-09" },
      { name:"test", label:"Incoming test", type:"select", options:["Awaiting test","Pass","Reject"] },
      { name:"count", label:"Yarn count (leave blank for non-yarn)", type:"text", value:"" }
    ];
    ERP.modal({
      title:"Receive against " + po.id, okText:"Post GRN", body: ERP.form(fields),
      onOk(scope){
        const v = ERP.readForm(scope, fields); if(!v) return false;
        po.status = "Received";
        po.grn = ERP.nextId(db.purchaseOrders.filter(x => x.grn).map(x => ({ id:x.grn })), "GRN-", 4);
        const sup = ERP.by(db.suppliers, po.supplier);
        sup.payable += Number(v.qty) * po.rate;
        if(v.count){
          db.yarn.unshift({ id: ERP.nextId(db.yarn, "Y-", 4), count:v.count, type:po.item, blend:"—",
            shade:"Grey", supplier:po.supplier, recd: ERP.today(), rate:po.rate,
            kgIn:Number(v.qty), kgUsed:0, rack:v.rack, test:v.test });
        } else {
          const item = db.stores.find(s => s.name.toLowerCase() === po.item.toLowerCase());
          if(item) item.qty += Number(v.qty);
          else db.stores.push({ id: ERP.nextId(db.stores, "CH-", 2), name:po.item, group:"Chemical",
            unit:po.unit, qty:Number(v.qty), reorder:Math.round(Number(v.qty)*0.25), rate:po.rate });
        }
        ERP.save(); ERP.toast("Received " + ERP.num(v.qty) + " " + po.unit + " on " + po.grn + "."); render();
      }
    });
  }

  const poAct = ERP.actions({
    list:"purchaseOrders", title:"Purchase order",
    fields:[
      { name:"date", label:"Date", type:"date", required:true },
      { name:"supplier", label:"Supplier", type:"select", options: db.suppliers.map(s => ({ value:s.id, label:s.name })) },
      { name:"item", label:"Item", type:"text", required:true, full:true },
      { name:"qty", label:"Quantity", type:"number", required:true },
      { name:"unit", label:"Unit", type:"select", options:["kg","nos","m","litre"] },
      { name:"rate", label:"Rate", type:"number", required:true },
      { name:"due", label:"Wanted by", type:"date" },
      { name:"status", label:"Status", type:"select", options:["Ordered","Part received","Received","Cancelled"] }
    ],
    canDelete: p => p.grn ? "Material has been received against this order on " + p.grn + "." : null,
    after: () => render()
  });

  function render(){
    const open = db.purchaseOrders.filter(p => p.status === "Ordered");
    const value = db.purchaseOrders.reduce((s,p) => s + p.qty*p.rate, 0);

    page.innerHTML = `
      <div class="page-head"><div class="ph-txt"><h2>Purchase</h2>
        <p>${open.length} orders awaiting material · ${ERP.crore(value)} bought this month</p></div>
        <button class="btn btn-primary" id="new">New purchase order</button></div>
      ${ERP.kpis([
        { label:"Open orders", value: open.length, tone:"sky" },
        { label:"Committed", value: ERP.crore(open.reduce((s,p)=>s+p.qty*p.rate,0)) },
        { label:"Payable", value: ERP.crore(db.suppliers.reduce((s,x)=>s+x.payable,0)), tone:"rose" },
        { label:"Below reorder", value: db.stores.filter(s=>s.qty<=s.reorder).length + " items", tone:"amber" }
      ])}
      <div class="tabs">
        <button class="tab ${tab==="orders"?"is-on":""}" data-tab="orders">Purchase orders</button>
        <button class="tab ${tab==="sup"?"is-on":""}" data-tab="sup">Suppliers</button>
        <button class="tab ${tab==="need"?"is-on":""}" data-tab="need">What to buy</button>
      </div>
      <div class="card" id="body"></div>`;

    const body = page.querySelector("#body");
    if(tab === "orders"){
      body.innerHTML = ERP.table([
        { h:"Order", key:"id", cls:"mono strong" },
        { h:"Date", render:p => ERP.date(p.date) },
        { h:"Supplier", render:p => ERP.esc(ERP.nameOf(db.suppliers,p.supplier)) },
        { h:"Item", key:"item" },
        { h:"Quantity", cls:"num", render:p => ERP.num(p.qty) + " " + p.unit },
        { h:"Rate", cls:"num", render:p => ERP.money(p.rate) },
        { h:"Value", cls:"num", render:p => ERP.crore(p.qty*p.rate) },
        { h:"Wanted by", render:p => ERP.date(p.due) },
        { h:"GRN", render:p => p.grn ? `<span class="mono">${p.grn}</span>` : "—" },
        { h:"Status", render:p => ERP.statusBadge(p.status) },
        { h:"", cls:"num", render:p => p.status === "Ordered" ? `<span class="row-act"><button class="btn btn-sm" data-r="${p.id}">Receive</button></span>` : "" },
        poAct.col
      ], db.purchaseOrders);
      poAct.wire(body);
      body.querySelectorAll("[data-r]").forEach(b => b.onclick = () => receive(ERP.by(db.purchaseOrders, b.dataset.r)));
    }
    if(tab === "sup"){
      body.innerHTML = ERP.table([
        { h:"Code", key:"id", cls:"mono" },
        { h:"Supplier", key:"name", cls:"strong" },
        { h:"City", key:"city" },
        { h:"Supplies", key:"supplies" },
        { h:"GSTIN", key:"gstin", cls:"mono" },
        { h:"Contact", render:s => ERP.esc(s.contact) + " · " + ERP.esc(s.phone) },
        { h:"Terms", key:"terms" },
        { h:"Payable", cls:"num", render:s => s.payable ? ERP.crore(s.payable) : "—" }
      ], db.suppliers);
    }
    if(tab === "need"){
      const rows = [];
      db.stores.filter(s => s.qty <= s.reorder).forEach(s =>
        rows.push({ what:s.name, have: ERP.num(s.qty) + " " + s.unit, level: ERP.num(s.reorder) + " " + s.unit,
          why:"Below reorder level", buy: ERP.num(Math.max(s.reorder*2 - s.qty, 0)) + " " + s.unit }));
      db.prodOrders.filter(p => p.status === "Planned").forEach(p => {
        const f = ERP.by(db.fabrics, p.fabric);
        const kg = (p.qty * f.gsm * (f.width*0.0254)) / 1000 * 1.05;
        const y = ERP.by(db.yarn, p.yarnLot);
        const free = y ? y.kgIn - y.kgUsed : 0;
        if(free < kg) rows.push({ what:(y?y.count:"Yarn") + " for " + p.id, have: ERP.num(free) + " kg",
          level: ERP.dec(kg) + " kg", why:"Planned order " + p.id, buy: ERP.dec(kg - free) + " kg" });
      });
      body.innerHTML = ERP.table([
        { h:"Item", key:"what", cls:"strong" },
        { h:"In hand", key:"have", cls:"num" },
        { h:"Needed", key:"level", cls:"num" },
        { h:"Reason", key:"why" },
        { h:"Suggested order", key:"buy", cls:"num" }
      ], rows, { emptyTitle:"Nothing to buy", emptyText:"Stores and planned orders are covered." });
    }

    page.querySelector("#new").onclick = newPO;
    page.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  }
  render();
})();
</script>
</body></html>
