<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>People · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>
<script>
(function(){
  const db = ERP.db;
  const page = ERP.shell({ title:"People & payroll", crumb:"Manage", page:"hr.html", module:"hr" });
  if(!page) return;
  let tab = "people";

  const empFields = [
    { name:"name",  label:"Name", type:"text", required:true },
    { name:"dept",  label:"Department", type:"select", options:["Weaving","Processing","Printing","Garment","Quality","Stores","Dispatch","Maintenance","Accounts","Admin"] },
    { name:"role",  label:"Designation", type:"text", required:true },
    { name:"shift", label:"Shift", type:"select", options:["A","B","C","General"] },
    { name:"doj",   label:"Date of joining", type:"date" },
    { name:"wage",  label:"Daily wage (₹)", type:"number", required:true },
    { name:"present", label:"Days present this month", type:"number", value:0 },
    { name:"phone", label:"Phone", type:"tel" }
  ];

  const emp = ERP.crud({
    list:"employees", prefix:"E-", width:3, title:"Employee", fields:empFields, extra:{ present:0 },
    cols:[
      { h:"Employee", render:e => `<span class="people"><span class="avatar-lg">${ERP.initials(e.name)}</span>
          <span><b>${ERP.esc(e.name)}</b><span>${ERP.esc(e.role)}</span></span></span>` },
      { h:"Code", key:"id", cls:"mono" },
      { h:"Department", render:e => ERP.badge(e.dept, "violet") },
      { h:"Shift", key:"shift" },
      { h:"Joined", render:e => ERP.date(e.doj) },
      { h:"Wage", cls:"num", render:e => ERP.money(e.wage) },
      { h:"Present", cls:"num", render:e => e.present + " / 26" },
      { h:"Attendance", render:e => ERP.bar((e.present/26)*100, e.present >= 24 ? "ok" : e.present >= 20 ? "" : "bad") }
    ],
    after: render
  });

  function markAttendance(){
    const f = [
      { name:"date", label:"Date", type:"date", value: ERP.today(), required:true },
      { name:"shift", label:"Shift", type:"select", options:["A","B","C"] },
      { name:"present", label:"Present", type:"number", required:true, min:0 },
      { name:"absent", label:"Absent", type:"number", value:0, min:0 },
      { name:"overtime", label:"Overtime hours", type:"number", value:0, min:0 }
    ];
    ERP.modal({
      title:"Mark the shift", okText:"Post attendance", body: ERP.form(f),
      onOk(scope){
        const v = ERP.readForm(scope, f); if(!v) return false;
        db.attendance.unshift({ date:v.date, shift:v.shift, present:Number(v.present),
          absent:Number(v.absent), overtime:Number(v.overtime) });
        db.employees.filter(e => e.shift === v.shift).forEach(e => { e.present = Math.min(26, e.present + 1); });
        ERP.save(); ERP.toast("Shift " + v.shift + " posted for " + ERP.date(v.date) + "."); render();
      }
    });
  }

  function render(){
    const wageBill = db.employees.reduce((s,e) => s + e.wage*e.present, 0);
    const ot = db.attendance.reduce((s,a) => s + a.overtime, 0);
    const byDept = {};
    db.employees.forEach(e => byDept[e.dept] = (byDept[e.dept] || 0) + 1);
    const colors = ["#5B4BF5","#0FB89B","#E38E07","#E23A63","#2A7FE0","#7A6BFF","#3FD9BC"];

    page.innerHTML = `
      <div class="page-head">
        <div class="ph-txt"><h2>People</h2>
          <p>The people on the floor, what they are paid, and who turned up.</p></div>
        <button class="btn" id="att">Mark attendance</button>
        <button class="btn btn-primary" id="add">Add employee</button>
      </div>
      ${ERP.kpis([
        { label:"On the roll", value: db.employees.length },
        { label:"Wage bill this month", value: ERP.crore(wageBill), tone:"sky" },
        { label:"Overtime logged", value: ot + " hrs", tone:"amber" },
        { label:"Average attendance", value: ERP.dec(db.employees.reduce((s,e)=>s+e.present,0)/db.employees.length/26*100) + "%", tone:"teal" }
      ])}
      <div class="tabs">
        <button class="tab ${tab==="people"?"is-on":""}" data-tab="people">Employees</button>
        <button class="tab ${tab==="att"?"is-on":""}" data-tab="att">Attendance</button>
        <button class="tab ${tab==="pay"?"is-on":""}" data-tab="pay">Payroll</button>
      </div>
      <div id="body"></div>`;

    const body = page.querySelector("#body");
    if(tab === "people"){
      body.innerHTML = `<div class="card">${emp.html()}</div>`;
      emp.wire(body);
    }
    if(tab === "att"){
      body.innerHTML = `<div class="grid g-21">
        <div class="card"><div class="card-head"><h3>Shift register</h3></div>
        ${ERP.table([
          { h:"Date", render:a => ERP.date(a.date) },
          { h:"Shift", key:"shift" },
          { h:"Present", cls:"num", render:a => a.present },
          { h:"Absent", cls:"num", render:a => a.absent },
          { h:"Turnout", render:a => ERP.bar((a.present/(a.present+a.absent))*100, "ok") },
          { h:"Overtime", cls:"num", render:a => a.overtime + " hrs" }
        ], db.attendance)}</div>
        <div class="card"><div class="card-head"><h3>Headcount by department</h3></div>
          <div class="card-body">${ERP.donut(Object.entries(byDept).map(([l,v],i) =>
            ({ l, v, color: colors[i % colors.length] })))}</div></div>
      </div>`;
    }
    if(tab === "pay"){
      const rows = db.employees.map(e => ({ e, gross: e.wage*e.present, pf: Math.round(e.wage*e.present*0.12),
        net: Math.round(e.wage*e.present*0.88) }));
      body.innerHTML = `<div class="card"><div class="card-head"><h3>Payroll · August 2026</h3>
        <span class="right"><button class="btn btn-sm" onclick="window.print()">Print</button></span></div>
        ${ERP.table([
          { h:"Code", render:r => r.e.id, cls:"mono" },
          { h:"Name", render:r => ERP.esc(r.e.name), cls:"strong" },
          { h:"Department", render:r => r.e.dept },
          { h:"Days", cls:"num", render:r => r.e.present },
          { h:"Daily wage", cls:"num", render:r => ERP.money(r.e.wage) },
          { h:"Gross", cls:"num", render:r => ERP.money(r.gross) },
          { h:"PF 12%", cls:"num", render:r => ERP.money(r.pf) },
          { h:"Net payable", cls:"num", render:r => `<b>${ERP.money(r.net)}</b>` }
        ], rows, { foot:{} })}
        <div class="card-body"><div class="note">Gross ${ERP.crore(rows.reduce((s,r)=>s+r.gross,0))} ·
          PF ${ERP.crore(rows.reduce((s,r)=>s+r.pf,0))} ·
          net payable <b>${ERP.crore(rows.reduce((s,r)=>s+r.net,0))}</b>.</div></div></div>`;
    }

    page.querySelector("#add").onclick = () => emp.editor();
    page.querySelector("#att").onclick = markAttendance;
    page.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  }
  render();
})();
</script>
</body></html>
