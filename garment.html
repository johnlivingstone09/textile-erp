<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garment · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>
<script>
(function(){
  const db = ERP.db;
  const page = ERP.shell({ title:"Garment", crumb:"Make", page:"garment.html", module:"garment" });
  if(!page) return;
  let tab = "styles";

  const styleFields = [
    { name:"name",   label:"Style name", type:"text", required:true, full:true },
    { name:"buyer",  label:"Buyer", type:"select", options: db.customers.map(c => ({ value:c.id, label:c.name })) },
    { name:"fabric", label:"Fabric", type:"select", options: db.fabrics.map(f => ({ value:f.id, label:f.name })) },
    { name:"sizes",  label:"Size range", type:"text", hint:"e.g. S–XXL" },
    { name:"smv",    label:"SMV (minutes)", type:"number", step:"0.1", required:true },
    { name:"rate",   label:"Selling rate per piece (₹)", type:"number", required:true },
    { name:"sample", label:"Sample status", type:"select", options:["In development","Sample sent","Approved","Rejected"] }
  ];
  const styles = ERP.crud({
    list:"styles", prefix:"ST-", width:3, title:"Style", fields:styleFields,
    cols:[
      { h:"Code", key:"id", cls:"mono" },
      { h:"Style", key:"name", cls:"strong" },
      { h:"Buyer", render:s => ERP.esc(ERP.nameOf(db.customers, s.buyer)) },
      { h:"Fabric", render:s => ERP.esc(ERP.nameOf(db.fabrics, s.fabric)) },
      { h:"Sizes", key:"sizes" },
      { h:"SMV", cls:"num", render:s => ERP.dec(s.smv) },
      { h:"Rate", cls:"num", render:s => ERP.money(s.rate) },
      { h:"Sample", render:s => ERP.statusBadge(s.sample) }
    ],
    canDelete(s){ return db.cutLots.some(c => c.style === s.id) ? "Cutting lots exist against this style." : null; },
    after: render
  });

  function newCut(){
    const f = [
      { name:"date",   label:"Date", type:"date", value: ERP.today(), required:true },
      { name:"style",  label:"Style", type:"select", required:true,
        options: db.styles.map(s => ({ value:s.id, label:s.id + " — " + s.name })) },
      { name:"fabricM",label:"Fabric issued (m)", type:"number", required:true, min:1 },
      { name:"layers", label:"Layers in the lay", type:"number", required:true, min:1 },
      { name:"marker", label:"Marker efficiency", type:"text", value:"92%" },
      { name:"cutPcs", label:"Pieces cut", type:"number", required:true, min:1 },
      { name:"bundles",label:"Bundles made", type:"number", required:true, min:1 }
    ];
    const m = ERP.modal({
      title:"New cutting lot", wide:true, okText:"Save lot",
      body: ERP.form(f) + `<div id="calc" style="margin-top:14px"></div>`,
      onOk(scope){
        const v = ERP.readForm(scope, f); if(!v) return false;
        const id = ERP.nextId(db.cutLots, "CL-", 4);
        const st = ERP.by(db.styles, v.style);
        const fab = ERP.by(db.fabrics, st.fabric);
        const need = Number(v.cutPcs) * (fab.gsm > 150 ? 1.8 : 1.5);
        const wastage = Math.max(0, ((Number(v.fabricM) - need) / Number(v.fabricM)) * 100);
        db.cutLots.unshift({ id, date:v.date, style:v.style, fabricM:Number(v.fabricM), layers:Number(v.layers),
          marker:v.marker, cutPcs:Number(v.cutPcs), wastage:Number(ERP.dec(wastage)), bundles:Number(v.bundles) });
        ERP.save(); ERP.toast("Lot " + id + " saved · wastage " + ERP.dec(wastage) + "%."); render();
      }
    });
    function calc(){
      const st = ERP.by(db.styles, m.el.querySelector('[name="style"]').value);
      const fab = ERP.by(db.fabrics, st.fabric);
      const pcs = Number(m.el.querySelector('[name="cutPcs"]').value) || 0;
      const issued = Number(m.el.querySelector('[name="fabricM"]').value) || 0;
      const need = pcs * (fab.gsm > 150 ? 1.8 : 1.5);
      const w = issued ? ((issued - need) / issued) * 100 : 0;
      m.el.querySelector("#calc").innerHTML = `<dl class="def">
        <div><dt>Fabric</dt><dd>${ERP.esc(fab.name)}</dd></div>
        <div><dt>Standard consumption</dt><dd>${ERP.dec(need)} m</dd></div>
        <div><dt>Issued</dt><dd>${ERP.num(issued)} m</dd></div>
        <div><dt>Wastage</dt><dd>${ERP.dec(w)}%</dd></div>
        <div><dt>SMV per piece</dt><dd>${ERP.dec(st.smv)} min</dd></div>
        <div><dt>Line minutes needed</dt><dd>${ERP.num(Math.round(pcs*st.smv))}</dd></div>
      </dl>`;
    }
    m.el.querySelectorAll('[name="style"],[name="cutPcs"],[name="fabricM"]').forEach(e => e.addEventListener("input", calc));
    calc();
  }

  function lineModal(l){
    const f = [
      { name:"style", label:"Style running", type:"select", options:["—"].concat(db.styles.map(s => s.id)), value:l.style },
      { name:"operators", label:"Operators on the line", type:"number", value:l.operators },
      { name:"target", label:"Shift target (pieces)", type:"number", value:l.target },
      { name:"actual", label:"Pieces produced", type:"number", value:l.actual },
      { name:"hours", label:"Hours run", type:"number", value:l.hours },
      { name:"defects", label:"Defects found", type:"number", value:l.defects },
      { name:"status", label:"Status", type:"select", options:["Running","Idle","Changeover"], value:l.status }
    ];
    ERP.modal({
      title: l.id + " · stitching line", wide:true, okText:"Update", body: ERP.form(f),
      onOk(scope){
        const v = ERP.readForm(scope, f); if(!v) return false;
        Object.assign(l, { style:v.style, operators:Number(v.operators), target:Number(v.target),
          actual:Number(v.actual), hours:Number(v.hours), defects:Number(v.defects), status:v.status });
        ERP.save(); ERP.toast(l.id + " updated."); render();
      }
    });
  }

  function render(){
    const cut = db.cutLots.reduce((s,c) => s + c.cutPcs, 0);
    const made = db.stitchLines.reduce((s,l) => s + l.actual, 0);
    const target = db.stitchLines.reduce((s,l) => s + l.target, 0);
    const defects = db.stitchLines.reduce((s,l) => s + l.defects, 0);

    page.innerHTML = `
      <div class="page-head">
        <div class="ph-txt"><h2>Garment</h2>
          <p>Styles and tech packs, cutting lots with marker efficiency, and line-by-line stitching output.</p></div>
        <button class="btn" id="newCut">New cutting lot</button>
        <button class="btn btn-primary" id="addStyle">New style</button>
      </div>
      ${ERP.kpis([
        { label:"Styles", value: db.styles.length, note: db.styles.filter(s => s.sample === "Approved").length + " approved" },
        { label:"Pieces cut", value: ERP.num(cut), tone:"sky" },
        { label:"Stitched today", value: ERP.num(made), note:"Target " + ERP.num(target) },
        { label:"Line efficiency", value: target ? ERP.dec((made/target)*100) + "%" : "—", tone: made/target > .9 ? "teal" : "amber" },
        { label:"Defects", value: defects, tone: defects > 40 ? "rose" : "amber" }
      ])}
      <div class="tabs">
        <button class="tab ${tab==="styles"?"is-on":""}" data-tab="styles">Styles</button>
        <button class="tab ${tab==="cutting"?"is-on":""}" data-tab="cutting">Cutting</button>
        <button class="tab ${tab==="lines"?"is-on":""}" data-tab="lines">Stitching lines</button>
      </div>
      <div id="body"></div>`;

    const body = page.querySelector("#body");
    if(tab === "styles"){ body.innerHTML = `<div class="card">${styles.html()}</div>`; styles.wire(body); }
    if(tab === "cutting"){
      body.innerHTML = `<div class="card">${ERP.table([
        { h:"Lot", key:"id", cls:"mono strong" },
        { h:"Date", render:c => ERP.date(c.date) },
        { h:"Style", render:c => ERP.esc(ERP.nameOf(db.styles, c.style)) },
        { h:"Fabric issued", cls:"num", render:c => ERP.num(c.fabricM) + " m" },
        { h:"Layers", cls:"num", key:"layers" },
        { h:"Marker", key:"marker" },
        { h:"Pieces cut", cls:"num", render:c => ERP.num(c.cutPcs) },
        { h:"Bundles", cls:"num", key:"bundles" },
        { h:"Wastage", cls:"num", render:c => `<span class="${c.wastage > 6 ? "badge red" : ""}">${ERP.dec(c.wastage)}%</span>` }
      ], db.cutLots)}</div>`;
    }
    if(tab === "lines"){
      body.innerHTML = `<div class="grid g-3">${db.stitchLines.map(l => {
        const eff = l.target ? (l.actual/l.target)*100 : 0;
        const st = ERP.by(db.styles, l.style);
        return `<div class="card" style="cursor:pointer" data-l="${l.id}">
          <div class="card-head"><h3>Line ${ERP.esc(l.id.replace("LN-",""))}</h3>
            <span class="right">${ERP.statusBadge(l.status)}</span></div>
          <div class="card-body">
            <dl class="def" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
              <div><dt>Target</dt><dd>${ERP.num(l.target)}</dd></div>
              <div><dt>Actual</dt><dd>${ERP.num(l.actual)}</dd></div>
              <div><dt>Operators</dt><dd>${l.operators}</dd></div>
            </dl>
            ${ERP.bar(eff, eff >= 90 ? "ok" : eff >= 75 ? "" : "bad")}
            <p style="margin:12px 0 0;font-size:.83rem;color:var(--muted)">
              ${st ? ERP.esc(st.name) + " · SMV " + ERP.dec(st.smv) : "No style loaded"}<br>
              ${l.defects} defects · ${l.hours} hrs run</p>
          </div></div>`;
      }).join("")}</div>`;
      body.querySelectorAll("[data-l]").forEach(c =>
        c.onclick = () => lineModal(db.stitchLines.find(l => l.id === c.dataset.l)));
    }

    page.querySelector("#addStyle").onclick = () => styles.editor();
    page.querySelector("#newCut").onclick = newCut;
    page.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  }
  render();
})();
</script>
</body></html>
