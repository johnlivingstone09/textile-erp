<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>

<script>
(function(){
  const db = ERP.db;
  const page = ERP.shell({ title:"Reports", crumb:"Manage", page:"reports.html", module:"reports" });
  if(!page) return;
  let rep = "sales";

  const total = i => i.metres*i.rate*(1+i.gst/100);

  const REPORTS = {
    sales: { name:"Sales by customer", build(){
      const rows = db.customers.map(c => {
        const os = db.salesOrders.filter(o => o.customer === c.id);
        const metres = os.reduce((s,o) => s + o.qty, 0);
        const value = os.reduce((s,o) => s + o.qty*o.rate, 0);
        const del = os.reduce((s,o) => s + o.dispatched*o.rate, 0);
        return { c, n:os.length, metres, value, del };
      }).filter(r => r.n).sort((a,b) => b.value - a.value);
      return ERP.table([
        { h:"Customer", render:r => ERP.esc(r.c.name), cls:"strong" },
        { h:"City", render:r => ERP.esc(r.c.city) },
        { h:"Orders", cls:"num", render:r => r.n },
        { h:"Metres", cls:"num", render:r => ERP.num(r.metres) },
        { h:"Order value", cls:"num", render:r => ERP.crore(r.value) },
        { h:"Delivered value", cls:"num", render:r => ERP.crore(r.del) },
        { h:"Share", render:r => ERP.bar((r.value / rows.reduce((s,x)=>s+x.value,0))*100) }
      ], rows);
    }},
    product: { name:"Sales by fabric", build(){
      const rows = db.fabrics.map(f => {
        const os = db.salesOrders.filter(o => o.fabric === f.id);
        const metres = os.reduce((s,o) => s + o.qty, 0);
        const value = os.reduce((s,o) => s + o.qty*o.rate, 0);
        const avg = metres ? value/metres : 0;
        const cost = f.rate * 0.78;
        return { f, metres, value, avg, margin: avg ? ((avg-cost)/avg)*100 : 0 };
      }).filter(r => r.metres).sort((a,b) => b.value - a.value);
      return ERP.table([
        { h:"Fabric", render:r => ERP.esc(r.f.name), cls:"strong" },
        { h:"Construction", render:r => r.f.warp + " × " + r.f.weft + " · " + r.f.gsm + " GSM" },
        { h:"Metres sold", cls:"num", render:r => ERP.num(r.metres) },
        { h:"Value", cls:"num", render:r => ERP.crore(r.value) },
        { h:"Average rate", cls:"num", render:r => ERP.money(r.avg) },
        { h:"Est. margin", cls:"num", render:r => ERP.dec(r.margin) + "%" },
        { h:"", render:r => r.margin > 20 ? ERP.badge("Healthy","green") : ERP.badge("Thin","amber") }
      ], rows);
    }},
    machine: { name:"Production by machine", build(){
      const rows = db.machines.filter(m => m.id.startsWith("L")).map(m => {
        const es = db.prodEntries.filter(e => e.machine === m.id);
        const metres = es.reduce((s,e) => s + e.metres, 0);
        const down = es.reduce((s,e) => s + e.downtime, 0);
        const insp = db.inspections.filter(i => { const r = ERP.by(db.rolls, i.roll); return r && r.machine === m.id; });
        const pts = insp.reduce((s,i) => s + i.points, 0);
        return { m, days: es.length, metres, down, avg: es.length ? metres/es.length : 0,
                 eff: m.target && es.length ? (metres/(m.target*es.length))*100 : 0, pts };
      });
      return ERP.table([
        { h:"Machine", render:r => ERP.esc(r.m.name), cls:"strong" },
        { h:"Type", render:r => r.m.type },
        { h:"Entries", cls:"num", render:r => r.days },
        { h:"Metres", cls:"num", render:r => ERP.num(r.metres) },
        { h:"Average/shift", cls:"num", render:r => ERP.num(Math.round(r.avg)) },
        { h:"Efficiency", render:r => ERP.bar(r.eff, r.eff>90?"ok":r.eff>80?"":"bad") },
        { h:"Downtime", cls:"num", render:r => r.down + " min" },
        { h:"Defect points", cls:"num", render:r => r.pts }
      ], rows);
    }},
    stock: { name:"Stock valuation", build(){
      const yarnRows = db.yarn.map(y => ({ what:"Yarn " + y.id + " · " + y.count, qty: ERP.num(y.kgIn-y.kgUsed) + " kg", val:(y.kgIn-y.kgUsed)*y.rate }));
      const rollRows = db.rolls.filter(r => r.status === "In stock").map(r => {
        const f = ERP.by(db.fabrics, r.fabric);
        return { what:"Roll " + r.id + " · " + f.name, qty: r.metres + " m", val: r.metres*f.rate };
      });
      const storeRows = db.stores.map(s => ({ what:s.group + " · " + s.name, qty: ERP.num(s.qty) + " " + s.unit, val:s.qty*s.rate }));
      const all = yarnRows.concat(rollRows, storeRows);
      const sum = all.reduce((s,r) => s + r.val, 0);
      return ERP.table([
        { h:"Item", key:"what", cls:"strong" },
        { h:"Quantity", key:"qty", cls:"num" },
        { h:"Value", cls:"num", render:r => ERP.money(r.val) }
      ], all, { foot:{ what:"Total stock", val: ERP.crore(sum) } });
    }},
    quality: { name:"Rejection and defects", build(){
      const rows = {};
      db.inspections.forEach(i => i.defects.forEach(d => {
        rows[d.type] = rows[d.type] || { n:0, rolls:new Set() };
        rows[d.type].n += d.n; rows[d.type].rolls.add(i.roll);
      }));
      const list = Object.entries(rows).map(([t,v]) => ({ t, n:v.n, rolls:v.rolls.size, pts:v.n*2 }))
        .sort((a,b) => b.pts - a.pts);
      const totalPts = list.reduce((s,r) => s + r.pts, 0);
      return ERP.table([
        { h:"Defect", render:r => ERP.esc(r.t), cls:"strong" },
        { h:"Occurrences", cls:"num", render:r => r.n },
        { h:"Rolls affected", cls:"num", render:r => r.rolls },
        { h:"Points", cls:"num", render:r => r.pts },
        { h:"Share of points", render:r => ERP.bar((r.pts/totalPts)*100) }
      ], list, { foot:{ } });
    }},
    jobwork: { name:"Job work loss by vendor", build(){
      const rows = db.suppliers.map(s => {
        const js = db.jobWorks.filter(j => j.vendor === s.id && j.recdKg);
        const sent = js.reduce((t,j) => t + j.sentKg, 0);
        const recd = js.reduce((t,j) => t + j.recdKg, 0);
        return { s, n:js.length, sent, recd, loss: sent ? ((sent-recd)/sent)*100 : 0,
                 bill: js.reduce((t,j) => t + j.recdKg*j.rate, 0) };
      }).filter(r => r.n);
      return ERP.table([
        { h:"Vendor", render:r => ERP.esc(r.s.name), cls:"strong" },
        { h:"Jobs", cls:"num", render:r => r.n },
        { h:"Sent (kg)", cls:"num", render:r => ERP.num(r.sent) },
        { h:"Received (kg)", cls:"num", render:r => ERP.num(r.recd) },
        { h:"Loss", cls:"num", render:r => ERP.dec(r.loss) + "%" },
        { h:"Bill", cls:"num", render:r => ERP.money(r.bill) },
        { h:"", render:r => r.loss > 4 ? ERP.badge("Above agreed","red") : ERP.badge("Within limit","green") }
      ], rows);
    }},
    finance: { name:"Receivables and payables", build(){
      const rows = db.invoices.map(i => ({ i, due: total(i) - i.paid }));
      const sum = rows.reduce((s,r) => s + r.due, 0);
      return `${ERP.table([
        { h:"Invoice", render:r => r.i.id, cls:"mono strong" },
        { h:"Date", render:r => ERP.date(r.i.date) },
        { h:"Customer", render:r => ERP.esc(ERP.nameOf(db.customers, r.i.customer)) },
        { h:"Total", cls:"num", render:r => ERP.money(total(r.i)) },
        { h:"Received", cls:"num", render:r => ERP.money(r.i.paid) },
        { h:"Due", cls:"num", render:r => ERP.money(r.due) },
        { h:"Status", render:r => ERP.statusBadge(r.i.status) }
      ], rows, { foot:{} })}
      <div class="card-body"><div class="note">Receivable ${ERP.crore(sum)} against payable
        ${ERP.crore(db.suppliers.reduce((s,x)=>s+x.payable,0))}.</div></div>`;
    }},
    payroll: { name:"Attendance and wages", build(){
      const rows = db.employees.map(e => ({ e, wage: e.wage * e.present }));
      const sum = rows.reduce((s,r) => s + r.wage, 0);
      return ERP.table([
        { h:"Code", render:r => r.e.id, cls:"mono" },
        { h:"Name", render:r => ERP.esc(r.e.name), cls:"strong" },
        { h:"Department", render:r => r.e.dept },
        { h:"Shift", render:r => r.e.shift },
        { h:"Days present", cls:"num", render:r => r.e.present },
        { h:"Daily wage", cls:"num", render:r => ERP.money(r.e.wage) },
        { h:"Month's wage", cls:"num", render:r => ERP.money(r.wage) }
      ], rows, { foot:{} }) + `<div class="card-body"><div class="note">Wage bill for the month: <b>${ERP.crore(sum)}</b>.</div></div>`;
    }}
  };

  function render(){
    page.innerHTML = `
      <div class="page-head"><div class="ph-txt"><h2>Reports</h2>
        <p>Everything below is worked out from live records — nothing is typed in twice.</p></div>
        <button class="btn" onclick="window.print()">Print this report</button></div>
      <div class="tabs">${Object.keys(REPORTS).map(k =>
        `<button class="tab ${k===rep?"is-on":""}" data-r="${k}">${REPORTS[k].name}</button>`).join("")}</div>
      <div class="card"><div class="card-head"><h3>${REPORTS[rep].name}</h3>
        <span class="card-sub">${ERP.esc(db.company.name)} · ${ERP.date(ERP.today())}</span></div>
        ${REPORTS[rep].build()}</div>`;
    page.querySelectorAll(".tab").forEach(b => b.onclick = () => { rep = b.dataset.r; render(); });
  }
  render();
})();
</script>
</body></html>
