<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>
<script>
(function(){
  const db = ERP.db, d = ERP.derive();
  const page = ERP.shell({ title:"Dashboard", crumb:"Overview", page:"dashboard.html", module:"dashboard" });
  if(!page) return;
  const u = ERP.user();

  const hist = db.history.slice(-16).map(h => ({ l: ERP.date(h.date).slice(0,6), v: h.metres }));
  const alerts = ERP.alertList();
  const lateOrders = db.salesOrders.filter(o => o.status === "In production" && o.qty > o.produced);
  const hour = new Date().getHours();
  const greet = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";

  page.innerHTML = `
    <div class="hero-band">
      <div class="hb-in">
        <div>
          <h2>${greet}, ${ERP.esc(u.name.split(" ")[0])}</h2>
          <p>${ERP.esc(db.company.name)} · ${ERP.esc(u.branch)} · shift A running</p>
        </div>
        <div class="hb-stat">
          <div><div class="k">Woven today</div><div class="v">${ERP.num(d.producedToday)} m</div></div>
          <div><div class="k">Efficiency</div><div class="v">${ERP.dec(d.efficiency)}%</div></div>
          <div><div class="k">Machines up</div><div class="v">${d.running}/${db.machines.length}</div></div>
          <div><div class="k">Order book</div><div class="v">${ERP.crore(d.orderValue)}</div></div>
        </div>
      </div>
    </div>

    ${ERP.kpis([
      { label:"Open orders", value: d.openOrders.length, note: ERP.crore(d.orderValue) + " still to deliver" },
      { label:"Stock on hand", value: ERP.crore(d.yarnValue + d.fabricValue + d.storeValue), note:"Yarn, fabric and stores", tone:"sky" },
      { label:"Receivable", value: ERP.crore(d.receivable), note:"Payable " + ERP.crore(d.payable), tone:"rose" },
      { label:"Quality pass", value: ERP.dec(100 - d.rejection) + "%", note: db.inspections.length + " rolls inspected", tone:"teal" },
      { label:"Needs attention", value: alerts.length, note:"Rolls, stock, machines and money", tone:"amber" }
    ])}

    <div class="grid g-21 mb">
      <div class="card">
        <div class="card-head"><h3>Production</h3><span class="card-sub">metres woven per day, last 16 days</span>
          <span class="right"><a class="btn btn-sm" href="production.html">Open production</a></span></div>
        <div class="card-body">${ERP.barChart(hist, { height:150 })}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Where the money sits</h3></div>
        <div class="card-body">${ERP.donut([
          { l:"Yarn", v: Math.round(d.yarnValue), color:"#5B4BF5" },
          { l:"Fabric", v: Math.round(d.fabricValue), color:"#0FB89B" },
          { l:"Stores", v: Math.round(d.storeValue), color:"#E38E07" },
          { l:"Receivable", v: Math.round(d.receivable), color:"#E23A63" }
        ], { money:true })}</div>
      </div>
    </div>

    <div class="grid g-21 mb">
      <div class="card">
        <div class="card-head"><h3>Live orders</h3><span class="right"><a class="btn btn-sm" href="sales.html">All orders</a></span></div>
        ${ERP.table([
          { h:"Order", key:"id", cls:"mono strong" },
          { h:"Customer", render:o => ERP.esc(ERP.nameOf(db.customers,o.customer)) },
          { h:"Fabric", render:o => ERP.esc(ERP.nameOf(db.fabrics,o.fabric)) },
          { h:"Metres", cls:"num", render:o => ERP.num(o.qty) },
          { h:"Delivered", render:o => ERP.bar((o.dispatched/o.qty)*100, o.dispatched/o.qty > .6 ? "ok" : "") },
          { h:"Due", render:o => ERP.date(o.due) },
          { h:"Status", render:o => ERP.statusBadge(o.status) }
        ], d.openOrders, { emptyTitle:"No live orders" })}
      </div>
      <div class="card">
        <div class="card-head"><h3>Machines</h3><span class="card-sub">shift A</span></div>
        ${ERP.table([
          { h:"Machine", key:"name" },
          { h:"Metres", cls:"num", render:m => ERP.num(m.actual) },
          { h:"Eff.", cls:"num", render:m => m.target ? ERP.dec((m.actual/m.target)*100,0) + "%" : "—" },
          { h:"", render:m => ERP.statusBadge(m.status) }
        ], db.machines)}
      </div>
    </div>

    <div class="grid g-3">
      <div class="card">
        <div class="card-head"><h3>Needs a decision</h3><span class="right">${ERP.badge(alerts.length + " open","amber")}</span></div>
        <div class="card-body" style="display:grid;gap:9px">
          ${alerts.slice(0,5).map(a => `<a class="switch" href="${a.href}" style="text-decoration:none">
            <span class="badge ${a.tone}"></span><span><b>${ERP.esc(a.text)}</b></span></a>`).join("")
            || `<div class="empty"><b>All clear</b>Nothing is waiting on you.</div>`}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Delivery risk</h3></div>
        <div class="card-body">
          ${lateOrders.map(o => {
            const left = o.qty - o.produced, days = Math.ceil(left / 1800);
            const tight = new Date(o.due) - Date.now() < days * 86400000;
            return `<p style="margin:0 0 11px"><b class="mono">${o.id}</b> — ${ERP.num(left)} m to weave,
              about ${days} working days. Due ${ERP.date(o.due)}. ${tight ? ERP.badge("Tight","red") : ERP.badge("On track","green")}</p>`;
          }).join("") || "<p>Every live order is inside its delivery date.</p>"}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>This month's spend</h3><span class="right"><a class="btn btn-sm" href="finance.html">Finance</a></span></div>
        <div class="card-body">
          ${ERP.table([
            { h:"Head", key:"head" },
            { h:"Amount", cls:"num", render:e => ERP.money(e.amount) }
          ], db.expenses.slice(0,5))}
          <div class="note violet" style="margin-top:12px">Total booked ${ERP.crore(d.spend)} against
            ${ERP.crore(d.invoiced)} invoiced.</div>
        </div>
      </div>
    </div>`;
})();
</script>
</body></html>
