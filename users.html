<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users & permissions · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>
<script>
(function(){
  const db = ERP.db;
  const page = ERP.shell({ title:"Users & permissions", crumb:"Manage", page:"users.html", module:"users" });
  if(!page) return;
  let tab = "users";

  const roleOpts = () => db.roles.map(r => ({ value:r.id, label:r.name }));
  const userFields = [
    { name:"name",   label:"Full name", type:"text", required:true },
    { name:"email",  label:"Email", type:"email", required:true },
    { name:"roleId", label:"Role", type:"select", options: roleOpts(), required:true },
    { name:"pin",    label:"Passcode", type:"text", required:true, hint:"Four digits. The demo ships with 1234." },
    { name:"active", label:"Account active", type:"checkbox", full:true, hint:"A suspended user cannot sign in" }
  ];

  const users = ERP.crud({
    list:"users", prefix:"U-", width:2, title:"User", fields:userFields,
    extra:{ active:true, role:"" },
    onSave(rec){ rec.role = ERP.nameOf(db.roles, rec.roleId); ERP.save(); },
    canDelete(rec){
      const me = ERP.user();
      if(rec.id === me.id) return "You cannot delete the account you are signed in with.";
      const directors = db.users.filter(u => u.roleId === "R-01" && u.active !== false);
      if(rec.roleId === "R-01" && directors.length < 2) return "Keep at least one director account.";
      return null;
    },
    cols:[
      { h:"User", render:u => `<span class="people"><span class="avatar-lg">${ERP.initials(u.name)}</span>
          <span><b>${ERP.esc(u.name)}</b><span>${ERP.esc(u.email)}</span></span></span>` },
      { h:"Code", key:"id", cls:"mono" },
      { h:"Role", render:u => ERP.badge(ERP.nameOf(db.roles, u.roleId), "violet") },
      { h:"Screens", cls:"num", render:u => { const r = ERP.by(db.roles, u.roleId); return (r ? r.perms.length : 0) + " / " + db.modulesList.length; } },
      { h:"Status", render:u => ERP.statusBadge(u.active === false ? "Suspended" : "Active") }
    ],
    after: render
  });

  const roleFields = [
    { name:"name", label:"Role name", type:"text", required:true },
    { name:"note", label:"What this role does", type:"text", full:true, required:true }
  ];
  const roles = ERP.crud({
    list:"roles", prefix:"R-", width:2, title:"Role", fields:roleFields,
    extra:{ perms:["dashboard"] },
    canDelete(rec){
      if(rec.id === "R-01") return "The director role cannot be deleted.";
      const used = db.users.filter(u => u.roleId === rec.id).length;
      if(used) return used + " user(s) still hold this role. Move them first.";
      return null;
    },
    cols:[
      { h:"Role", key:"name", cls:"strong" },
      { h:"Code", key:"id", cls:"mono" },
      { h:"What it does", key:"note" },
      { h:"Users", cls:"num", render:r => db.users.filter(u => u.roleId === r.id).length },
      { h:"Screens", cls:"num", render:r => r.perms.length + " / " + db.modulesList.length }
    ],
    after: render
  });

  function render(){
    const me = ERP.user();
    page.innerHTML = `
      <div class="page-head">
        <div class="ph-txt"><h2>Who can open what</h2>
          <p>Roles decide which screens appear in the sidebar. Change a tick in the matrix and it applies
             the next time that user loads a page.</p></div>
        <button class="btn" id="addRole">New role</button>
        <button class="btn btn-primary" id="addUser">Add user</button>
      </div>
      ${ERP.kpis([
        { label:"Users", value: db.users.length, note: db.users.filter(u => u.active !== false).length + " active" },
        { label:"Roles", value: db.roles.length },
        { label:"Screens", value: db.modulesList.length, tone:"sky" },
        { label:"You are", value: ERP.esc(ERP.nameOf(db.roles, me.roleId)), note:"Signed in as " + ERP.esc(me.name), tone:"teal" }
      ])}
      <div class="tabs">
        <button class="tab ${tab==="users"?"is-on":""}" data-tab="users">Users</button>
        <button class="tab ${tab==="roles"?"is-on":""}" data-tab="roles">Roles</button>
        <button class="tab ${tab==="matrix"?"is-on":""}" data-tab="matrix">Permission matrix</button>
      </div>
      <div class="card" id="body"></div>`;

    const body = page.querySelector("#body");
    if(tab === "users"){ body.innerHTML = users.html(); users.wire(body); }
    if(tab === "roles"){ body.innerHTML = roles.html(); roles.wire(body); }
    if(tab === "matrix"){
      const groups = {};
      db.modulesList.forEach(m => { (groups[m.group] = groups[m.group] || []).push(m); });
      body.innerHTML = `
        <div class="tbl-wrap"><table class="tbl matrix">
          <thead><tr><th>Screen</th>${db.roles.map(r => `<th class="num">${ERP.esc(r.name)}</th>`).join("")}</tr></thead>
          <tbody>
          ${Object.entries(groups).map(([g, mods]) => `
            <tr><td colspan="${db.roles.length+1}" style="background:var(--sunken);font-family:JetBrains Mono,monospace;
              font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">${ERP.esc(g)}</td></tr>
            ${mods.map(m => `<tr><td>${ERP.esc(m.name)}</td>
              ${db.roles.map(r => `<td><input type="checkbox" data-r="${r.id}" data-m="${m.key}"
                ${r.perms.indexOf(m.key) !== -1 ? "checked" : ""} ${r.id === "R-01" ? "disabled" : ""}></td>`).join("")}
            </tr>`).join("")}`).join("")}
          </tbody></table></div>
        <div class="card-body"><div class="note violet">The director role is fixed at every screen so nobody can
          lock themselves out of this page.</div></div>`;
      body.querySelectorAll("input[data-r]").forEach(cb => cb.onchange = () => {
        const role = ERP.by(db.roles, cb.dataset.r), key = cb.dataset.m;
        const i = role.perms.indexOf(key);
        if(cb.checked && i === -1) role.perms.push(key);
        if(!cb.checked && i !== -1) role.perms.splice(i, 1);
        ERP.save();
        ERP.toast(ERP.nameOf(db.modulesList.map(m => ({ id:m.key, name:m.name })), key) +
          (cb.checked ? " opened for " : " closed for ") + role.name + ".");
      });
    }

    page.querySelector("#addUser").onclick = () => users.editor();
    page.querySelector("#addRole").onclick = () => roles.editor();
    page.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  }
  render();
})();
</script>
</body></html>
