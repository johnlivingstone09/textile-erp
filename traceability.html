<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traceability · LoomLine Textile ERP</title>
<meta name="theme-color" content="#141733">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("loomline.theme")||"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="erp-styles.css">
</head><body>
<script src="erp-data.js"></script><script src="erp-core.js"></script>

<script>
(function(){
  const db = ERP.db;
  const page = ERP.shell({ title:"Traceability", crumb:"Stock", page:"traceability.html", module:"traceability" });
  if(!page) return;
  let current = ERP.param("roll") || db.rolls[0].id;

  function chainFor(id){
    const r = ERP.by(db.rolls, id);
    if(!r) return null;
    const f = ERP.by(db.fabrics, r.fabric);
    const po = ERP.by(db.prodOrders, r.po);
    const mc = ERP.by(db.machines, r.machine);
    const y  = ERP.by(db.yarn, r.yarnLot);
    const sup= y ? ERP.by(db.suppliers, y.supplier) : null;
    const insp = db.inspections.find(i => i.roll === r.id);
    const batch = r.dyeBatch ? ERP.by(db.dyeBatches, r.dyeBatch) : null;
    const jw = batch ? db.jobWorks.find(j => j.type === "Dyeing") : null;
    const so = ERP.by(db.salesOrders, r.so);
    const cust = so ? ERP.by(db.customers, so.customer) : null;
    const disp = db.dispatches.find(d => (d.rolls || []).includes(r.id));

    const links = [];
    links.push({ lvl:"Roll", id:r.id, flag: r.grade !== "A",
      meta:`${f.name} · ${r.metres} m · ${r.gsm} GSM · ${r.width}" · cut ${ERP.date(r.date)} · grade ${r.grade}` +
           (insp ? ` · ${insp.points} points, inspected by ${insp.inspector}` : "") });
    if(insp && insp.defects.length) links.push({ lvl:"Inspection", id:insp.id,
      meta: insp.defects.map(d => d.type + " ×" + d.n).join(", "), flag: insp.grade !== "A" });
    if(batch) links.push({ lvl:"Dye batch", id:batch.id,
      meta:`${batch.shade} · recipe ${batch.recipe} · ${batch.temp}°C for ${batch.mins} min on ${ERP.nameOf(db.machines,batch.machine)} · loss ${ERP.dec(batch.loss)}%` });
    if(jw) links.push({ lvl:"Job work", id:jw.id,
      meta:`${jw.process} at ${ERP.nameOf(db.suppliers,jw.vendor)} · sent ${jw.sentKg} kg, received ${jw.recdKg} kg` });
    if(po) links.push({ lvl:"Production order", id:po.id,
      meta:`${ERP.num(po.qty)} m planned against ${po.so} · started ${ERP.date(po.start)} · ${po.status.toLowerCase()}` });
    if(mc) links.push({ lvl:"Machine", id:mc.name, flag: mc.status === "Breakdown",
      meta:`${mc.type} · ${mc.make} · operator ${mc.operator} · shift ${mc.shift} · downtime ${mc.downtime} min` });
    if(y) links.push({ lvl:"Yarn lot", id:y.id,
      meta:`${y.count} ${y.type} · ${y.blend} · received ${ERP.date(y.recd)} · ${y.test}` });
    if(sup) links.push({ lvl:"Supplier", id:sup.name,
      meta:`${sup.city} · GSTIN ${sup.gstin} · ${sup.contact}, ${sup.phone}` });
    return { r, f, so, cust, disp, links };
  }

  function render(){
    const c = chainFor(current);
    page.innerHTML = `
      <div class="page-head"><div class="ph-txt"><h2>Pull the thread on any roll</h2>
        <p>Scan a tag on the floor, or pick a roll here, and the whole chain unwinds back to the supplier.</p></div></div>
      <div class="grid g-2-1">
        <div class="card">
          <div class="card-head"><h3>Chain for ${ERP.esc(current)}</h3>
            <span class="right"><select id="pick">${db.rolls.map(r =>
              `<option value="${r.id}" ${r.id===current?"selected":""}>${r.id} — ${ERP.esc(ERP.nameOf(db.fabrics,r.fabric))}</option>`).join("")}</select></span></div>
          <div class="card-body">
            ${c ? `<ol class="chain">${c.links.map(l => `
              <li class="${l.flag ? "flag" : ""}">
                <span class="lvl">${ERP.esc(l.lvl)}</span>
                <span class="id">${ERP.esc(l.id)}</span>
                <span class="meta">${ERP.esc(l.meta)}</span>
              </li>`).join("")}</ol>` : `<div class="empty"><b>No such roll</b></div>`}
          </div>
        </div>
        <div>
          <div class="card mb"><div class="card-head"><h3>Roll tag</h3></div>
            <div class="card-body" style="text-align:center">
              ${ERP.qrTag(current)}
              <p class="mono" style="margin:8px 0 0">${ERP.esc(current)}</p>
              <p style="font-size:.82rem;color:var(--muted);margin:4px 0 0">
                ${c ? c.r.metres + " m · " + c.r.gsm + " GSM · grade " + c.r.grade : ""}</p>
              <button class="btn btn-sm" style="margin-top:10px" onclick="window.print()">Print tag</button>
            </div></div>
          <div class="card"><div class="card-head"><h3>Where it went</h3></div>
            <div class="card-body">
              ${c && c.so ? `<p>Sales order <b class="mono">${c.so.id}</b> for ${ERP.esc(c.cust.name)}, ${ERP.esc(c.cust.city)}.</p>` : "<p>Not yet allotted to an order.</p>"}
              ${c && c.disp ? `<p>Dispatched on ${ERP.date(c.disp.date)} by ${ERP.esc(c.disp.transporter)},
                vehicle ${ERP.esc(c.disp.vehicle)}, e-way bill ${ERP.esc(c.disp.eway)}.</p>` : "<p>Still with us — " + (c ? ERP.esc(c.r.rack) : "") + ".</p>"}
              ${c && c.r.grade !== "A" ? `<div class="note red">This roll did not pass grade A. Same yarn lot,
                different machine — check the loom before you write to the spinner.</div>` : ""}
            </div></div>
        </div>
      </div>`;
    page.querySelector("#pick").onchange = e => { current = e.target.value; render(); };
  }
  render();
})();
</script>
</body></html>
